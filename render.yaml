services:
  - type: web
    name: second-look-paypal
    runtime: node
    plan: free # ponytail: free sleeps and has no disk, so SQLite resets on restart; move to starter + disk before judging (Dec 1-15)
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22" # node:sqlite needs Node 22
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD # shared sign-in password; give judges the same one in the Devpost testing instructions
        sync: false
      - key: DEMO # 1 = seed demo history, offer the Load demo button and default demo rules
        value: "1"
    # Before judging (Dec 1-15): switch plan to starter and uncomment, so SQLite survives deploys and restarts.
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add:  - key: DB_PATH
    #             value: /var/data/second-look.db

  # Render Workflows: reviews big batches (over 50 lines) in 50-line chunks, in parallel, with retries.
  # Not deployed yet. To turn on: uncomment this service, give it ANTHROPIC_API_KEY, then on the web service
  # set RENDER_API_KEY (Account settings > API keys) and RENDER_WORKFLOW_SLUG (this workflow's slug, shown in
  # the dashboard). Without RENDER_WORKFLOW_SLUG the web service reviews chunks in-process instead.
