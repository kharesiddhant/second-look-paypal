services:
  - type: web
    name: second-look-paypal
    runtime: node
    plan: free # ponytail: free sleeps and has no disk, so SQLite resets on restart; move to starter + disk before judging (Dec 1-15)
    region: oregon
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22" # node:sqlite needs Node 22
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
